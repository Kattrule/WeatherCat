<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherCat v5.6</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1b4b">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-sub: #cbd5e1;
            --primary: #38bdf8;
            --accent-temp: #f97316;
            --accent-wind: #34d399;
            --accent-rain: #60a5fa;
            --accent-thunder: #eab308;
            --warning: #f43f5e;
            --item-bg: rgba(15, 23, 42, 0.6);
        }
        
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container { max-width: 500px; width: 100%; margin: 0 auto; }

        /* SÖKRUTA & KNAPPAR */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .search-box input {
            flex: 1;
            padding: 15px;
            border-radius: 15px;
            border: 2px solid #475569;
            background: rgba(30, 41, 59, 0.9);
            color: var(--text-main);
            font-size: 16px;
            backdrop-filter: blur(10px);
        }
        .search-box input:focus {
            border-color: var(--primary);
            outline: none;
        }
        .search-box button {
            width: auto;
            padding: 0 25px;
            border-radius: 15px;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .mode-toggle {
            margin-bottom: 20px;
        }
        .mode-toggle button {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }
        .mode-toggle button.active-history {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }

        /* VÄDERKORT */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 15px rgba(56, 189, 248, 0.1);
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        h1, h2 { margin-top: 0; }
        h1 { font-size: 26px; color: var(--text-main); text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        h2 { font-size: 18px; color: var(--primary); text-align: left; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
        
        .temp { font-size: 68px; font-weight: 800; color: var(--accent-temp); margin: 10px 0; text-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        #avg-condition { font-size: 14px; color: #a7f3d0; margin-bottom: 20px; font-weight: bold; }

        .details { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .detail-item { 
            background: var(--item-bg); padding: 12px; 
            border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); 
        }
        .detail-item.wind-box span { color: var(--accent-wind); }
        .detail-item.rain-box span { color: var(--accent-rain); }
        .detail-item.thunder-box span { color: var(--accent-thunder); }
        .detail-item span { font-size: 12px; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
        .detail-item strong { display: block; font-size: 18px; margin-top: 4px; }

        /* TIMPROGNOS (Horisontell scroll) */
        .hourly-scroll {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding-bottom: 12px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }
        .hourly-item {
            background: var(--item-bg);
            min-width: 95px;
            padding: 12px 8px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }
        .hourly-time { font-size: 13px; color: var(--text-sub); margin-bottom: 5px; font-weight: bold; }
        .hourly-temp { font-size: 19px; font-weight: bold; color: var(--accent-temp); }
        .hourly-wind { font-size: 11px; color: var(--accent-wind); margin-top: 4px; }
        .hourly-rain-chance { font-size: 11px; color: var(--primary); margin-top: 4px; font-weight: bold; }
        .hourly-rain-amount { font-size: 11px; color: var(--text-sub); }
        .hourly-thunder { font-size: 11px; color: var(--accent-thunder); margin-top: 4px; font-weight: bold; }

        /* DAGSPROGNOS (Lista) */
        .daily-list { display: flex; flex-direction: column; gap: 10px; }
        .daily-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--item-bg);
            padding: 12px 15px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .version-tag {
            font-size: 12px;
            color: var(--text-sub);
            opacity: 0.7;
            margin-top: 10px;
            margin-bottom: 25px;
            text-align: center;
        }

        button {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8); 
            color: white; border: none;
            padding: 16px 20px; border-radius: 20px; font-size: 16px; font-weight: bold;
            cursor: pointer; width: 100%; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: transform 0.1s, filter 0.2s;
        }
        button:active { transform: scale(0.98); }
        button:hover { filter: brightness(1.2); }

    </style>
</head>
<body>

<div class="container">
    
    <div class="search-box">
        <input type="text" id="search-input" placeholder="Sök stad (t.ex. Karlstad)...">
        <button onclick="searchCity()">Sök</button>
    </div>

    <div class="mode-toggle">
        <button id="toggle-mode-btn" onclick="toggleHistoryMode()">📊 Jämför: Uppmätt vs Offset-korrigerad Prognos</button>
    </div>

    <div class="card">
        <h1 id="location">Hämtar din position...</h1>
        <div class="temp" id="avg-temp">--°C</div>
        <p id="avg-condition">Väntar på data...</p>
        
        <div class="details">
            <div class="detail-item wind-box">
                <span>💨 Vind (Medel)</span>
                <strong id="avg-wind">-- m/s</strong>
            </div>
            <div class="detail-item wind-box">
                <span>🌬️ Byvind (Blåst)</span>
                <strong id="avg-gust">-- m/s</strong>
            </div>
            <div class="detail-item rain-box">
                <span>🌧️ Regn</span>
                <strong id="avg-rain">-- mm</strong>
            </div>
            <div class="detail-item thunder-box">
                <span>⚡ Åskrisk</span>
                <strong id="avg-thunder">-- %</strong>
            </div>
        </div>
    </div>

    <div class="card">
        <h2 id="hourly-title">Kommande 24 timmarna</h2>
        <div class="hourly-scroll" id="hourly-container">
            Laddar timmar...
        </div>
    </div>

    <div class="card">
        <h2 id="daily-title">14-dygnsprognos</h2>
        <div class="daily-list" id="daily-container">
            Laddar dagar...
        </div>
    </div>

    <div class="version-tag">
        SuperVäder PWA v5.6 • Offset-korrigerad (SMHI + Yr + Open-Meteo)
    </div>

</div>

<script>
    let currentLat = 59.3293;
    let currentLon = 18.0686;
    let currentLocName = "Stockholm (Standard)";
    let isHistoryMode = false;

    window.onload = () => {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    currentLat = pos.coords.latitude;
                    currentLon = pos.coords.longitude;
                    currentLocName = "Min position";
                    loadWeatherData(currentLat, currentLon, currentLocName);
                },
                () => loadWeatherData(currentLat, currentLon, currentLocName)
            );
        } else {
            loadWeatherData(currentLat, currentLon, currentLocName);
        }
    };

    async function searchCity() {
        const query = document.getElementById('search-input').value;
        if (!query) return;

        document.getElementById('location').innerText = "Söker...";
        
        try {
            const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=sv&format=json`);
            const data = await res.json();
            
            if (data.results && data.results.length > 0) {
                const city = data.results[0];
                currentLat = city.latitude;
                currentLon = city.longitude;
                currentLocName = city.name;
                loadWeatherData(currentLat, currentLon, currentLocName);
            } else {
                document.getElementById('location').innerText = "Staden hittades inte.";
            }
        } catch (e) {
            console.error(e);
        }
    }

    function toggleHistoryMode() {
        isHistoryMode = !isHistoryMode;
        const btn = document.getElementById('toggle-mode-btn');
        if (isHistoryMode) {
            btn.innerText = "☀️ Tillbaka till normal framtida prognos";
            btn.classList.add('active-history');
        } else {
            btn.innerText = "📊 Jämför: Uppmätt vs Offset-korrigerad Prognos";
            btn.classList.remove('active-history');
        }
        loadWeatherData(currentLat, currentLon, currentLocName);
    }

    function calculateThunderRisk(cape) {
        if (!cape || cape < 100) return 0;
        if (cape < 500) return Math.round((cape / 500) * 25);
        if (cape < 1000) return Math.round(25 + ((cape - 500) / 500) * 35);
        if (cape < 2000) return Math.round(60 + ((cape - 1000) / 1000) * 25);
        return Math.min(100, Math.round(85 + ((cape - 2000) / 1000) * 15));
    }

    // Beräknar genomsnittlig avvikelse (Offset/Bias) för Temp, Vind och Regn
    async function calculateHistoricalBias(lat, lon) {
        let bias = { tempOffset: 0, windOffset: 0, rainOffset: 0 };

        try {
            const endDateObj = new Date();
            endDateObj.setDate(endDateObj.getDate() - 1);
            const endDate = endDateObj.toISOString().split('T')[0];
            
            const startDateObj = new Date();
            startDateObj.setDate(startDateObj.getDate() - 7);
            const startDate = startDateObj.toISOString().split('T')[0];

            const [resArch, resFc] = await Promise.all([
                fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${startDate}&end_date=${endDate}&daily=temperature_2m_max,wind_speed_10m_max,precipitation_sum`),
                fetch(`https://historical-forecast-api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&start_date=${startDate}&end_date=${endDate}&daily=temperature_2m_max,wind_speed_10m_max,precipitation_sum`)
            ]);

            const arch = await resArch.json();
            const fc = await resFc.json();

            if (arch.daily && fc.daily) {
                let tempDiffSum = 0;
                let windDiffSum = 0;
                let rainDiffSum = 0;
                let count = arch.daily.temperature_2m_max.length;

                for (let i = 0; i < count; i++) {
                    // Positivt värde = Prognosen visade för HÖGT jämfört med facit
                    tempDiffSum += (fc.daily.temperature_2m_max[i] - arch.daily.temperature_2m_max[i]);
                    windDiffSum += ((fc.daily.wind_speed_10m_max[i] / 3.6) - (arch.daily.wind_speed_10m_max[i] / 3.6));
                    rainDiffSum += (fc.daily.precipitation_sum[i] - arch.daily.precipitation_sum[i]);
                }

                bias.tempOffset = tempDiffSum / count; // t.ex. +2.0 om prognosen var 2 grader för hög
                bias.windOffset = windDiffSum / count;
                bias.rainOffset = rainDiffSum / count;
            }
        } catch (e) {
            console.warn("Kunde inte beräkna offset:", e);
        }

        return bias;
    }

    function saveForecastToHistory(dateKey, forecastObj) {
        try {
            const history = JSON.parse(localStorage.getItem('supervader_history') || '{}');
            history[dateKey] = forecastObj;
            localStorage.setItem('supervader_history', JSON.stringify(history));
        } catch (e) {
            console.warn("Kunde inte spara historik:", e);
        }
    }

    async function loadWeatherData(lat, lon, locationName) {
        document.getElementById('location').innerText = locationName + (isHistoryMode ? " (Prognos vs Verklighet)" : "");
        
        const queryLat = parseFloat(lat).toFixed(4);
        const queryLon = parseFloat(lon).toFixed(4);
        const smhiLat = parseFloat(lat).toFixed(6);
        const smhiLon = parseFloat(lon).toFixed(6);
        const isNordic = (lat >= 52 && lat <= 72 && lon >= 3 && lon <= 32);

        if (isHistoryMode) {
            const endDateObj = new Date();
            endDateObj.setDate(endDateObj.getDate() - 1);
            const endDate = endDateObj.toISOString().split('T')[0];
            
            const startDateObj = new Date();
            startDateObj.setDate(startDateObj.getDate() - 10);
            const startDate = startDateObj.toISOString().split('T')[0];

            try {
                const [resArchive, resHistForecast] = await Promise.all([
                    fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${queryLat}&longitude=${queryLon}&start_date=${startDate}&end_date=${endDate}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max`),
                    fetch(`https://historical-forecast-api.open-meteo.com/v1/forecast?latitude=${queryLat}&longitude=${queryLon}&start_date=${startDate}&end_date=${endDate}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum`)
                ]);

                const archData = await resArchive.json();
                const histData = await resHistForecast.json();
                const storedHistory = JSON.parse(localStorage.getItem('supervader_history') || '{}');

                if (!archData.daily) throw new Error("Kunde inte hämta jämförelsestatistik");

                const lastIdx = archData.daily.time.length - 1;
                document.getElementById('avg-temp').innerText = `${archData.daily.temperature_2m_max[lastIdx]}°C`;
                document.getElementById('avg-wind').innerText = `${(archData.daily.wind_speed_10m_max[lastIdx] / 3.6).toFixed(1)} m/s`;
                document.getElementById('avg-gust').innerText = `--`;
                document.getElementById('avg-rain').innerText = `${archData.daily.precipitation_sum[lastIdx]} mm`;
                document.getElementById('avg-thunder').innerText = `--`;
                document.getElementById('avg-condition').innerText = `📊 Jämförelse: Uppmätt facit vs Offset-korrigerad Prognos`;

                document.getElementById('hourly-title').innerText = "Om jämförelsen";
                const hourlyContainer = document.getElementById('hourly-container');
                hourlyContainer.innerHTML = `<div style="padding:15px; color:var(--text-sub); width:100%; font-size:14px;">Appen drar automatiskt av eller lägger till grader, vind och regn baserat på om prognoserna tidigare visat för högt eller för lågt.</div>`;

                document.getElementById('daily-title').innerText = "Jämförelse per dygn (Uppmätt vs Prognos)";
                const dailyContainer = document.getElementById('daily-container');
                dailyContainer.innerHTML = '';
                const veckodagar = ['Sön', 'Mån', 'Tis', 'Ons', 'Tor', 'Fre', 'Lör'];

                for (let i = 0; i < archData.daily.time.length; i++) {
                    const dateStr = archData.daily.time[i];
                    const date = new Date(dateStr + 'T00:00:00');
                    const dayName = veckodagar[date.getDay()];
                    
                    const actMax = Math.round(archData.daily.temperature_2m_max[i]);
                    const actMin = Math.round(archData.daily.temperature_2m_min[i]);
                    const actRain = archData.daily.precipitation_sum[i];

                    let fcMax = '--', fcMin = '--', fcRain = '--';
                    if (storedHistory[dateStr]) {
                        fcMax = storedHistory[dateStr].maxTemp;
                        fcMin = storedHistory[dateStr].minTemp;
                        fcRain = storedHistory[dateStr].rainSum;
                    } else if (histData.daily) {
                        fcMax = histData.daily.temperature_2m_max[i] !== undefined ? Math.round(histData.daily.temperature_2m_max[i]) : '--';
                        fcMin = histData.daily.temperature_2m_min[i] !== undefined ? Math.round(histData.daily.temperature_2m_min[i]) : '--';
                        fcRain = histData.daily.precipitation_sum[i] !== undefined ? histData.daily.precipitation_sum[i] : '--';
                    }

                    dailyContainer.innerHTML += `
                        <div class="daily-item" style="flex-direction: column; align-items: stretch; gap: 8px;">
                            <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 14px;">
                                <span>${dayName} (${dateStr})</span>
                                <span style="color: var(--accent-temp);">Uppmätt: ${actMax}° (${actMin}°)</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-sub); background: rgba(0,0,0,0.2); padding: 6px 10px; border-radius: 8px;">
                                <span>🔮 Prognos: ${fcMax}° (${fcMin}°)</span>
                                <span>🌧️ Regn (Faktisk: ${actRain}mm / Prog: ${fcRain}mm)</span>
                            </div>
                        </div>
                    `;
                }

            } catch (e) {
                console.error(e);
                document.getElementById('avg-condition').innerText = "Kunde inte ladda historisk data.";
            }
            return;
        }

        // BERÄKNA DYNAMISK OFFSET/BIAS
        const bias = await calculateHistoricalBias(queryLat, queryLon);

        let baseWeights = { smhi: isNordic ? 0.40 : 0.0, yr: isNordic ? 0.40 : 0.50, meteo: isNordic ? 0.20 : 0.50 };
        let currentData = { smhi: null, yr: null, meteo: null };
        let hourlyData = { smhi: {}, yr: {}, meteo: {} };
        let källor = [];

        // 1. SMHI
        if (isNordic) {
            try {
                const res = await fetch(`https://opendata-download-metfcst.smhi.se/api/category/pmp3g/version/2/geotype/point/lon/${smhiLon}/lat/${smhiLat}/data.json`);
                if (res.ok) {
                    const data = await res.json();
                    källor.push("SMHI");
                    const first = data.timeSeries[0].parameters;
                    const getVal = (name) => { const p = first.find(x => x.name === name); return p ? p.values[0] : 0; };
                    currentData.smhi = { temp: getVal("t"), wind: getVal("ws"), gust: getVal("gust"), rain: getVal("pmean"), thunderRisk: calculateThunderRisk(getVal("cape")) };
                    data.timeSeries.forEach(item => {
                        const timeKey = new Date(item.validTime).toISOString().substring(0, 13) + ":00";
                        const p = item.parameters;
                        const gV = (n) => { const x = p.find(y => y.name === n); return x ? x.values[0] : 0; };
                        hourlyData.smhi[timeKey] = { temp: gV("t"), wind: gV("ws"), gust: gV("gust"), rain: gV("pmean"), thunderRisk: calculateThunderRisk(gV("cape")) };
                    });
                }
            } catch(e) {}
        }

        // 2. YR
        try {
            const res = await fetch(`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${queryLat}&lon=${queryLon}`, { headers: { 'User-Agent': 'SuperVaderPWA/5.6' }});
            if (res.ok) {
                const data = await res.json();
                källor.push("Yr");
                const ts = data.properties.timeseries;
                const cInst = ts[0].data.instant.details;
                const cNext = ts[0].data.next_1_hours ? ts[0].data.next_1_hours.details : {};
                currentData.yr = { temp: cInst.air_temperature, wind: cInst.wind_speed, gust: cInst.wind_speed_of_gust || cInst.wind_speed, rain: cNext.precipitation_amount || 0, thunderRisk: 0 };
                ts.slice(0, 48).forEach(item => {
                    const timeKey = new Date(item.time).toISOString().substring(0, 13) + ":00";
                    const inst = item.data.instant.details;
                    const next1 = item.data.next_1_hours ? item.data.next_1_hours.details : {};
                    hourlyData.yr[timeKey] = { temp: inst.air_temperature, wind: inst.wind_speed, gust: inst.wind_speed_of_gust || inst.wind_speed, rain: next1.precipitation_amount || 0, thunderRisk: 0 };
                });
            }
        } catch(e) {}

        // 3. OPEN-METEO
        let meteoRaw = null;
        try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${queryLat}&longitude=${queryLon}&current=temperature_2m,rain,wind_speed_10m,wind_gusts_10m,cape&hourly=temperature_2m,precipitation,precipitation_probability,wind_speed_10m,wind_gusts_10m,cape&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,cape_max&forecast_days=14&timezone=auto`);
            if (res.ok) {
                meteoRaw = await res.json();
                källor.push("Open-Meteo");
                currentData.meteo = { temp: meteoRaw.current.temperature_2m, wind: meteoRaw.current.wind_speed_10m / 3.6, gust: (meteoRaw.current.wind_gusts_10m || 0) / 3.6, rain: meteoRaw.current.rain || 0, thunderRisk: calculateThunderRisk(meteoRaw.current.cape) };
                meteoRaw.hourly.time.forEach((t, i) => {
                    const timeKey = new Date(t).toISOString().substring(0, 13) + ":00";
                    hourlyData.meteo[timeKey] = { temp: meteoRaw.hourly.temperature_2m[i], wind: meteoRaw.hourly.wind_speed_10m[i] / 3.6, gust: (meteoRaw.hourly.wind_gusts_10m[i] || 0) / 3.6, rain: meteoRaw.hourly.precipitation[i], rainProb: meteoRaw.hourly.precipitation_probability[i], thunderRisk: calculateThunderRisk(meteoRaw.hourly.cape ? meteoRaw.hourly.cape[i] : 0) };
                });
            }
        } catch(e) {}

        if (källor.length === 0) {
            document.getElementById('avg-condition').innerText = "Kunde inte hämta väderdata.";
            return;
        }

        let totalW = 0, sumTemp = 0, sumWind = 0, sumGust = 0, sumRain = 0, sumThunder = 0;
        ['smhi', 'yr', 'meteo'].forEach(src => {
            if (currentData[src]) {
                const w = baseWeights[src];
                totalW += w;
                sumTemp += currentData[src].temp * w;
                sumWind += currentData[src].wind * w;
                sumGust += currentData[src].gust * w;
                sumRain += currentData[src].rain * w;
                sumThunder += currentData[src].thunderRisk * w;
            }
        });

        // TILLÄMPA KORRIGERING (OFFSET-JUSTERING)
        const correctedTemp = (sumTemp / totalW) - bias.tempOffset;
        const correctedWind = Math.max(0, (sumWind / totalW) - bias.windOffset);
        const correctedGust = Math.max(0, (sumGust / totalW) - bias.windOffset);
        const correctedRain = Math.max(0, (sumRain / totalW) - bias.rainOffset);

        document.getElementById('avg-temp').innerText = `${correctedTemp.toFixed(1)}°C`;
        document.getElementById('avg-wind').innerText = `${correctedWind.toFixed(1)} m/s`;
        document.getElementById('avg-gust').innerText = `${correctedGust.toFixed(1)} m/s`;
        document.getElementById('avg-rain').innerText = `${correctedRain.toFixed(1)} mm`;
        document.getElementById('avg-thunder').innerText = `${Math.round(sumThunder / totalW)}%`;
        
        const note = Math.abs(bias.tempOffset) > 0.5 ? ` (Justerat ${bias.tempOffset > 0 ? '-' : '+'}${Math.abs(bias.tempOffset).toFixed(1)}°C)` : '';
        document.getElementById('avg-condition').innerText = `🧬 Offset-korrigerad prognos via: ${källor.join(', ')}${note}`;

        document.getElementById('hourly-title').innerText = "Kommande 24 timmarna";
        const hourlyContainer = document.getElementById('hourly-container');
        hourlyContainer.innerHTML = '';
        const now = new Date();
        const currentHourStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), 0, 0, 0);

        for (let i = 0; i < 24; i++) {
            const hourTarget = new Date(currentHourStart.getTime() + i * 3600000);
            const timeKey = hourTarget.toISOString().substring(0, 13) + ":00";
            let hW = 0, hTemp = 0, hWind = 0, hGust = 0, hRain = 0, hThunder = 0, hRainProb = 0;

            ['smhi', 'yr', 'meteo'].forEach(src => {
                if (hourlyData[src] && hourlyData[src][timeKey]) {
                    const w = baseWeights[src];
                    const d = hourlyData[src][timeKey];
                    hW += w; hTemp += d.temp * w; hWind += d.wind * w; hGust += d.gust * w; hRain += d.rain * w; hThunder += d.thunderRisk * w;
                    if (d.rainProb !== undefined) hRainProb = d.rainProb;
                }
            });

            if (hW > 0) {
                const finalTemp = Math.round((hTemp / hW) - bias.tempOffset);
                const finalWind = Math.max(0, (hWind / hW) - bias.windOffset).toFixed(1);
                const finalGust = Math.max(0, (hGust / hW) - bias.windOffset).toFixed(1);
                const finalRain = Math.max(0, (hRain / hW) - bias.rainOffset).toFixed(1);
                const finalThunder = Math.round(hThunder / hW);
                const timeString = hourTarget.toLocaleTimeString('sv-SE', { hour: '2-digit', minute:'2-digit' });

                hourlyContainer.innerHTML += `
                    <div class="hourly-item">
                        <div class="hourly-time">${i === 0 ? 'Nu' : timeString}</div>
                        <div class="hourly-temp">${finalTemp}°</div>
                        <div class="hourly-wind">💨 ${finalWind} (${finalGust})</div>
                        <div class="hourly-rain-chance">💧 ${hRainProb}%</div>
                        <div class="hourly-rain-amount">${parseFloat(finalRain) > 0 ? `${finalRain}mm` : '0 mm'}</div>
                        ${finalThunder > 10 ? `<div class="hourly-thunder">⚡ ${finalThunder}%</div>` : ''}
                    </div>
                `;
            }
        }

        document.getElementById('daily-title').innerText = "14-dygnsprognos";
        const dailyContainer = document.getElementById('daily-container');
        dailyContainer.innerHTML = '';
        const veckodagar = ['Sön', 'Mån', 'Tis', 'Ons', 'Tor', 'Fre', 'Lör'];

        if (meteoRaw && meteoRaw.daily) {
            for (let i = 0; i < meteoRaw.daily.time.length; i++) {
                const dateStr = meteoRaw.daily.time[i];
                const date = new Date(dateStr + 'T00:00:00');
                const dayName = i === 0 ? 'Idag' : (i === 1 ? 'Imorgon' : veckodagar[date.getDay()]);
                
                const maxTemp = Math.round(meteoRaw.daily.temperature_2m_max[i] - bias.tempOffset);
                const minTemp = Math.round(meteoRaw.daily.temperature_2m_min[i] - bias.tempOffset);
                const dailyRainSum = Math.max(0, meteoRaw.daily.precipitation_sum[i] - bias.rainOffset);
                const dailyRainProb = meteoRaw.daily.precipitation_probability_max[i];
                const maxWind = Math.max(0, (meteoRaw.daily.wind_speed_10m_max[i] / 3.6) - bias.windOffset).toFixed(1);
                const maxGust = Math.max(0, (meteoRaw.daily.wind_gusts_10m_max[i] / 3.6) - bias.windOffset).toFixed(1);
                const dayCape = meteoRaw.daily.cape_max ? meteoRaw.daily.cape_max[i] : 0;
                const thunderRisk = calculateThunderRisk(dayCape);

                saveForecastToHistory(dateStr, {
                    maxTemp,
                    minTemp,
                    rainSum: dailyRainSum > 0 ? dailyRainSum.toFixed(1) : 0
                });

                dailyContainer.innerHTML += `
                    <div class="daily-item">
                        <div class="daily-day">${dayName}</div>
                        <div class="daily-weather-info">
                            <div class="daily-rain-chance">💧 ${dailyRainProb}% (${dailyRainSum > 0 ? dailyRainSum.toFixed(1) : '0'} mm)</div>
                            <div class="daily-wind-info">💨 Max ${maxWind} (${maxGust}) m/s</div>
                            ${thunderRisk > 15 ? `<div class="daily-thunder-info">⚡ Åskrisk ${thunderRisk}%</div>` : ''}
                        </div>
                        <div class="daily-temps">${maxTemp}° <span>${minTemp}°</span></div>
                    </div>
                `;
            }
        }
    }
</script>
</body>
</html>
