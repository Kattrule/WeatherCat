    <style>
        :root {

        *, *::before, *::after { box-sizing: border-box; }

        .daily-temps span { color: #64748b; font-weight: normal; margin-left: 4px; }
    </style>
</head>
<body>

<div class="container">
    
    <div class="search-box">
        <input type="text" id="search-input" placeholder="Sök stad (t.ex. Karlstad)...">
        <button onclick="searchCity()">Sök</button>
    </div>

    <div class="card">
        <h1 id="location">Hämtar din position...</h1>
        <div class="temp" id="avg-temp">--°C</div>
        <p id="avg-condition">Beräknar superprognos...</p>
        
        <div class="details-grid">
            <div class="detail-item wind-box">
                <span>💨 Vind</span>
                <strong id="avg-wind">-- m/s</strong>
            </div>
            <div class="detail-item gust-box">
                <span>🌪️ Byvind</span>
                <strong id="avg-gust">-- m/s</strong>
            </div>
            <div class="detail-item rain-box">
                <span>🌧️ Regn</span>
                <strong id="avg-rain">-- mm</strong>
            </div>
            <div class="detail-item thunder-box">
                <span>⚡ Åskrisk</span>
                <strong id="avg-thunder">-- %</strong>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>Kommande 24 timmarna</h2>
        <div class="hourly-scroll" id="hourly-container">
            Laddar timmar...
        </div>
    </div>

    <div class="card">
        <h2>7-dygnsprognos</h2>
        <div class="daily-list" id="daily-container">
            Laddar dagar...
        </div>
    </div>

</div>

<script>
    window.onload = () => {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => loadWeatherData(pos.coords.latitude, pos.coords.longitude, "Min position"),
                () => loadWeatherData(59.3293, 18.0686, "Stockholm (Standard)")
            );
        } else {
            loadWeatherData(59.3293, 18.0686, "Stockholm (Standard)");
        }
    };

    async function searchCity() {
        const query = document.getElementById('search-input').value;
        if (!query) return;

        document.getElementById('location').innerText = "Söker...";
        
        try {
            const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=sv&format=json`);
            const data = await res.json();
            
            if (data.results && data.results.length > 0) {
                const city = data.results[0];
                loadWeatherData(city.latitude, city.longitude, city.name);
            } else {
                document.getElementById('location').innerText = "Staden hittades inte.";
            }
        } catch (e) {
            console.error("Fel vid sökning:", e);
        }
    }

    async function fetchSmhiData(smhiLon, smhiLat) {
        // Kontrollera om positionen ligger inom SMHI:s område (Norden/Nordeuropa)
        const lat = parseFloat(smhiLat);
        const lon = parseFloat(smhiLon);
        if (lat < 52 || lat > 72 || lon < 2 || lon > 32) {
            console.warn("SMHI har inte täckning för denna geografiska plats.");
            return null;
        }

        const urls = [
            `https://opendata-download-metfcst.smhi.se/api/category/pmp3g/version/2/geotype/point/lon/${smhiLon}/lat/${smhiLat}/data.json`,
            `https://opendata-download-metfcst.smhi.se/api/category/snow1g/version/1/geotype/point/lon/${smhiLon}/lat/${smhiLat}/data.json`
        ];

        for (const url of urls) {
            try {
                const res = await fetch(url);
                if (res.ok) {
                    return await res.json();
                }
            } catch (e) {
                console.warn(`Misslyckades att hämta SMHI från ${url}`, e);
            }
        }
        return null;
    }

    async function loadWeatherData(lat, lon, locationName) {
        document.getElementById('location').innerText = locationName;
        
        const queryLat = parseFloat(lat).toFixed(4);
        const queryLon = parseFloat(lon).toFixed(4);
        const smhiLat = parseFloat(lat).toFixed(6);
        const smhiLon = parseFloat(lon).toFixed(6);

        const basVikter = { smhi: 0.45, yr: 0.45, meteo: 0.10 };
        let totalVikt = 0, sumTemp = 0, sumWind = 0, sumGust = 0, sumRain = 0, sumThunder = 0;
        let källor = [];

        let smhiData = null, yrData = null, meteoData = null;

        // --- 1. SMHI ---
        smhiData = await fetchSmhiData(smhiLon, smhiLat);
        if (smhiData && smhiData.timeSeries && smhiData.timeSeries.length > 0) {
            const cur = smhiData.timeSeries[0].parameters;
            
            const t = cur.find(p => p.name === "t")?.values[0] ?? 0;
            const ws = cur.find(p => p.name === "ws")?.values[0] ?? 0;
            const gust = cur.find(p => p.name === "gust")?.values[0] ?? ws;
            const rain = cur.find(p => p.name === "pmean")?.values[0] ?? 0;
            const tstm = cur.find(p => p.name === "tstm")?.values[0] ?? 0;

            sumTemp += t * basVikter.smhi;
            sumWind += ws * basVikter.smhi;
            sumGust += gust * basVikter.smhi;
            sumRain += rain * basVikter.smhi;
            sumThunder += tstm * basVikter.smhi;

            totalVikt += basVikter.smhi;
            källor.push("SMHI");
        }

        // --- 2. YR (met.no) ---
        try {
            const res = await fetch(`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${queryLat}&lon=${queryLon}`, {
                headers: { 'User-Agent': 'SuperVaderPWA/5.0 github.com/weatherapp' }
            });
            if (res.ok) {
                yrData = await res.json();
                const cur = yrData.properties.timeseries[0].data;
                const details = cur.instant.details;
                
                const t = details.air_temperature ?? 0;
                const ws = details.wind_speed ?? 0;
                const gust = details.wind_speed_of_gust ?? ws;
                const rain = cur.next_1_hours ? (cur.next_1_hours.details.precipitation_amount ?? 0) : 0;
                
                const symbolCode = cur.next_1_hours?.summary?.symbol_code || "";
                const yrThunder = symbolCode.includes("thunder") ? 80 : 0;

                sumTemp += t * basVikter.yr;
                sumWind += ws * basVikter.yr;
                sumGust += gust * basVikter.yr;
                sumRain += rain * basVikter.yr;
                sumThunder += yrThunder * basVikter.yr;

                totalVikt += basVikter.yr;
                källor.push("Yr");
            }
        } catch(e) { console.warn("Yr-fel:", e); }

        // --- 3. OPEN-METEO ---
        try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${queryLat}&longitude=${queryLon}&current=temperature_2m,rain,wind_speed_10m,wind_gusts_10m,weather_code&hourly=temperature_2m,precipitation,precipitation_probability,wind_speed_10m,wind_gusts_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,weather_code&timezone=auto`);
            if (res.ok) {
                meteoData = await res.json();
                const cur = meteoData.current;

                const t = cur.temperature_2m ?? 0;
                const ws = (cur.wind_speed_10m / 3.6) ?? 0;
                const gust = (cur.wind_gusts_10m / 3.6) ?? ws;
                const rain = cur.rain ?? 0;
                const wCode = cur.weather_code ?? 0;
                const meteoThunder = (wCode >= 95) ? 90 : 0;

                sumTemp += t * basVikter.meteo;
                sumWind += ws * basVikter.meteo;
                sumGust += gust * basVikter.meteo;
                sumRain += rain * basVikter.meteo;
                sumThunder += meteoThunder * basVikter.meteo;

                totalVikt += basVikter.meteo;
                källor.push("Open-Meteo");
            }
        } catch(e) { console.warn("Open-Meteo fel:", e); }

        if (totalVikt === 0) {
            document.getElementById('avg-condition').innerText = "Kunde inte hämta data från någon källa.";
            document.getElementById('avg-condition').style.color = "var(--warning)";
            return;
        }

        // --- VISA DATA ---
        const finalTemp = (sumTemp / totalVikt).toFixed(1);
        const finalWind = (sumWind / totalVikt).toFixed(1);
        const finalGust = (sumGust / totalVikt).toFixed(1);
        const finalRain = (sumRain / totalVikt).toFixed(1);
        const finalThunder = Math.round(sumThunder / totalVikt);

        document.getElementById('avg-temp').innerText = `${finalTemp}°C`;
        document.getElementById('avg-wind').innerText = `${finalWind} m/s`;
        document.getElementById('avg-gust').innerText = `${finalGust} m/s`;
        document.getElementById('avg-rain').innerText = `${finalRain} mm`;
        document.getElementById('avg-thunder').innerText = `${finalThunder}%`;
        document.getElementById('avg-condition').innerText = `🧬 Super-prognos beräknad via: ${källor.join(', ')}`;

        // --- TIMMAR (24h) ---
        const hourlyContainer = document.getElementById('hourly-container');
        hourlyContainer.innerHTML = '';

        for (let i = 0; i < 24; i++) {
            let hTemp = 0, hWind = 0, hGust = 0, hRain = 0, hThunder = 0, hWeight = 0;

            if (smhiData && smhiData.timeSeries && smhiData.timeSeries[i]) {
                const params = smhiData.timeSeries[i].parameters;
                hTemp += (params.find(p => p.name === "t")?.values[0] ?? 0) * basVikter.smhi;
                const ws = params.find(p => p.name === "ws")?.values[0] ?? 0;
                hWind += ws * basVikter.smhi;
                hGust += (params.find(p => p.name === "gust")?.values[0] ?? ws) * basVikter.smhi;
                hRain += (params.find(p => p.name === "pmean")?.values[0] ?? 0) * basVikter.smhi;
                hThunder += (params.find(p => p.name === "tstm")?.values[0] ?? 0) * basVikter.smhi;
                hWeight += basVikter.smhi;
            }

            if (yrData && yrData.properties && yrData.properties.timeseries && yrData.properties.timeseries[i]) {
                const item = yrData.properties.timeseries[i].data;
                const d = item.instant.details;
                hTemp += (d.air_temperature ?? 0) * basVikter.yr;
                const ws = d.wind_speed ?? 0;
                hWind += ws * basVikter.yr;
                hGust += (d.wind_speed_of_gust ?? ws) * basVikter.yr;
                hRain += (item.next_1_hours?.details?.precipitation_amount ?? 0) * basVikter.yr;
                const sym = item.next_1_hours?.summary?.symbol_code || "";
                hThunder += (sym.includes("thunder") ? 80 : 0) * basVikter.yr;
                hWeight += basVikter.yr;
            }

            if (meteoData && meteoData.hourly) {
                hTemp += (meteoData.hourly.temperature_2m[i] ?? 0) * basVikter.meteo;
                const ws = (meteoData.hourly.wind_speed_10m[i] / 3.6) ?? 0;
                hWind += ws * basVikter.meteo;
                hGust += ((meteoData.hourly.wind_gusts_10m[i] / 3.6) ?? ws) * basVikter.meteo;
                hRain += (meteoData.hourly.precipitation[i] ?? 0) * basVikter.meteo;
                const wc = meteoData.hourly.weather_code[i] ?? 0;
                hThunder += (wc >= 95 ? 90 : 0) * basVikter.meteo;
                hWeight += basVikter.meteo;
            }

            if (hWeight > 0) {
                const hourTemp = Math.round(hTemp / hWeight);
                const hourWind = (hWind / hWeight).toFixed(1);
                const hourGust = (hGust / hWeight).toFixed(1);
                const hourRain = (hRain / hWeight).toFixed(1);
                const hourThunder = Math.round(hThunder / hWeight);

                let timeLabel = "Nu";
                if (i > 0) {
                    const dateObj = meteoData?.hourly?.time[i] ? new Date(meteoData.hourly.time[i]) : new Date(Date.now() + i*3600000);
                    timeLabel = dateObj.toLocaleTimeString('sv-SE', { hour: '2-digit', minute:'2-digit' });
                }

                hourlyContainer.innerHTML += `
                    <div class="hourly-item">
                        <div class="hourly-time">${timeLabel}</div>
                        <div class="hourly-temp">${hourTemp}°</div>
                        <div class="hourly-wind">💨 ${hourWind}</div>
                        <div class="hourly-gust">🌪️ ${hourGust} m/s</div>
                        <div class="hourly-rain">💧 ${hourRain > 0 ? hourRain + 'mm' : '0 mm'}</div>
                        ${hourThunder > 10 ? `<div class="hourly-thunder">⚡ ${hourThunder}%</div>` : ''}
                    </div>
                `;
            }
        }

        // --- DAGAR (7 dygn) ---
        const dailyContainer = document.getElementById('daily-container');
        dailyContainer.innerHTML = '';
        const veckodagar = ['Sön', 'Mån', 'Tis', 'Ons', 'Tor', 'Fre', 'Lör'];

        if (meteoData && meteoData.daily) {
            for (let i = 0; i < 7; i++) {
                const date = new Date(meteoData.daily.time[i]);
                const dayName = i === 0 ? 'Idag' : veckodagar[date.getDay()];
                
                const maxTemp = Math.round(meteoData.daily.temperature_2m_max[i]);
                const minTemp = Math.round(meteoData.daily.temperature_2m_min[i]);
                const rainSum = meteoData.daily.precipitation_sum[i];
                const rainProb = meteoData.daily.precipitation_probability_max[i] ?? 0;
                
                const windMax = (meteoData.daily.wind_speed_10m_max[i] / 3.6).toFixed(1);
                const gustMax = (meteoData.daily.wind_gusts_10m_max[i] / 3.6).toFixed(1);
                const wCode = meteoData.daily.weather_code[i] ?? 0;

                let dayThunder = 0;
                if (wCode >= 95) dayThunder = 85;
                else if (rainProb > 60 && gustMax > 12) dayThunder = 30;
                else if (rainProb > 40 && gustMax > 10) dayThunder = 15;

                dailyContainer.innerHTML += `
                    <div class="daily-item">
                        <div class="daily-day">${dayName}</div>
                        <div class="daily-col">
                            <div class="daily-rain-chance">💧 ${rainProb}%</div>
                            <div class="daily-rain-amount">${rainSum > 0 ? rainSum.toFixed(1) + ' mm' : '0 mm'}</div>
                        </div>
                        <div class="daily-col">
                            <div class="daily-wind">💨 ${windMax} (${gustMax})</div>
                            ${dayThunder > 15 ? `<div class="daily-thunder">⚡ ${dayThunder}% risk</div>` : '<div style="font-size:10px; opacity:0.5;">Låg åskrisk</div>'}
                        </div>
                        <div class="daily-temps">${maxTemp}° <span>${minTemp}°</span></div>
                    </div>
                `;
            }
        }
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(err => console.log(err)));
    }
</script>
</body>
</html>
