<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperVäder PWA 3.0</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#317EFB">
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --primary: #0088cc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { max-width: 500px; width: 100%; }
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            text-align: center;
        }
        .temp { font-size: 56px; font-weight: bold; color: var(--primary); margin: 15px 0; }
        .details { display: flex; justify-content: space-around; margin-top: 25px; font-size: 15px; }
        .detail-item { background: #f8f9fa; padding: 10px 15px; border-radius: 10px; width: 40%; }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0,136,204,0.3);
        }
        .source-tag { font-size: 11px; color: #7f8c8d; margin-top: 20px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Trippel-Prognosen</h1>
        <p id="location">Hämtar din GPS-position...</p>
        <div class="temp" id="avg-temp">--°C</div>
        <p id="avg-condition">Samlar in data från 3 källor...</p>
        
        <div class="details">
            <div class="detail-item">💨 Vind<br><strong id="avg-wind">-- m/s</strong></div>
            <div class="detail-item">🌧️ Regn<br><strong id="avg-rain">-- mm</strong></div>
        </div>
        <div class="source-tag">
            <strong>Viktning:</strong><br>
            🇸🇪 SMHI (45%) | 🇳🇴 Yr/Met.no (45%) | 🌍 Open-Meteo (10%)
        </div>
    </div>

    <button onclick="getWeather()">Uppdatera superprognos</button>
</div>

<script>
    async function getWeather() {
        if (!navigator.geolocation) {
            document.getElementById('location').innerText = "Geolokalisering stöds inte.";
            return;
        }

        document.getElementById('avg-condition').innerText = "Anropar servrar...";

        navigator.geolocation.getCurrentPosition(async (position) => {
            const lat = position.coords.latitude.toFixed(4);
            const lon = position.coords.longitude.toFixed(4);
            document.getElementById('location').innerText = `Plats: ${parseFloat(lat).toFixed(2)}, ${parseFloat(lon).toFixed(2)}`;

            try {
                // 1. HÄMTA DATA FRÅN ALLA 3 API:ER SAMTIDIGT
                const [resSMHI, resYr, resMeteo] = await Promise.all([
                    fetch(`https://opendata-download-metfcst.smhi.se/api/category/pmp3g/version/2/geotype/point/lon/${lon}/lat/${lat}/data.json`),
                    fetch(`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${lat}&lon=${lon}`, {
                        headers: { 'User-Agent': 'SuperVaderPWA/1.0 github.com/dinprofil' } // Yr kräver en unik User-Agent string
                    }),
                    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,rain,wind_speed_10m`)
                ]);

                // Konvertera alla svar till JSON
                const dataSMHI = await resSMHI.json();
                const dataYr = await resYr.json();
                const dataMeteo = await resMeteo.json();

                // 2. EXTRAHERA DATA FRÅN SMHI
                const smhiCurrent = dataSMHI.timeSeries[0].parameters;
                const smhiTemp = smhiCurrent.find(p => p.name === "t").values[0];
                const smhiWind = smhiCurrent.find(p => p.name === "ws").values[0];
                const smhiRain = smhiCurrent.find(p => p.name === "pmean").values[0];

                // 3. EXTRAHERA DATA FRÅN YR (MET.NO)
                const yrCurrent = dataYr.properties.timeseries[0].data;
                const yrTemp = yrCurrent.instant.details.air_temperature;
                const yrWind = yrCurrent.instant.details.wind_speed;
                const yrRain = yrCurrent.next_1_hours ? yrCurrent.next_1_hours.details.precipitation_amount : 0;

                // 4. EXTRAHERA DATA FRÅN OPEN-METEO
                const meteoTemp = dataMeteo.current.temperature_2m;
                const meteoWind = dataMeteo.current.wind_speed_10m / 3.6; // km/h -> m/s
                const meteoRain = dataMeteo.current.rain || 0;

                // 5. BERÄKNA VIKTAT GENOMSNITT (45% + 45% + 10%)
                const wSMHI = 0.45;
                const wYr = 0.45;
                const wMeteo = 0.10;

                const slutligTemp = ((smhiTemp * wSMHI) + (yrTemp * wYr) + (meteoTemp * wMeteo)).toFixed(1);
                const slutligWind = ((smhiWind * wSMHI) + (yrWind * wYr) + (meteoWind * wMeteo)).toFixed(1);
                const slutligRain = ((smhiRain * wSMHI) + (yrRain * wYr) + (meteoRain * wMeteo)).toFixed(1);

                // 6. VISA I APPPEN
                document.getElementById('avg-temp').innerText = `${slutligTemp}°C`;
                document.getElementById('avg-wind').innerText = `${slutligWind} m/s`;
                document.getElementById('avg-rain').innerText = `${slutligRain} mm`;
                document.getElementById('avg-condition').innerText = "Trippel-verifierad prognos klar!";

                // Konsol-logg för att du ska kunna se vad varje sa
                console.log(`Källor -> SMHI: ${smhiTemp}°C | Yr: ${yrTemp}°C | Meteo: ${meteoTemp}°C -> Resultat: ${slutligTemp}°C`);

            } catch (error) {
                console.error("Fel vid hämtning:", error);
                document.getElementById('avg-condition').innerText = "Ett av API:erna svarade inte. Försök igen.";
            }
        });
    }

    window.onload = getWeather;

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(err => console.log(err));
        });
    }
</script>
</body>
</html>
