<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperVäder PWA - Dark Mode</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <style>
        :root {
            --bg-color: #0f172a; /* Mörkblå/grå bakgrund */
            --card-bg: #1e293b;  /* Lite ljusare mörkblå för kortet */
            --text-main: #f8fafc; /* Vit text */
            --text-sub: #94a3b8;  /* Grå text för detaljer */
            --primary: #38bdf8;   /* Ljusblå accentfärg */
            --success: #34d399;   /* Grön färg för status */
            --warning: #fbbf24;   /* Gul färg om något API är nere */
        }
        
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: block;
        }

        .container { 
            max-width: 500px; 
            width: 100%; 
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #334155;
        }

        h1 {
            font-size: 22px;
            margin-top: 0;
            letter-spacing: 0.5px;
        }

        #location {
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 5px;
        }

        .temp { 
            font-size: 64px; 
            font-weight: 700; 
            color: var(--primary); 
            margin: 10px 0; 
        }

        #avg-condition {
            font-size: 15px;
            font-weight: 500;
            color: var(--success);
            margin-bottom: 20px;
        }

        .details { 
            display: table;
            width: 100%;
            margin-top: 25px; 
        }

        .detail-item { 
            display: table-cell;
            background: #111827; 
            padding: 15px; 
            border-radius: 12px; 
            width: 48%;
            border: 1px solid #1f2937;
        }
        .detail-item:first-child {
            margin-right: 4%; /* Ger luft mellan blocken */
        }

        .detail-item span {
            color: var(--text-sub);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-item strong {
            display: block;
            font-size: 18px;
            color: var(--text-main);
            margin-top: 5px;
        }

        button {
            background: var(--primary);
            color: #0f172a;
            border: none;
            padding: 15px 20px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
            transition: transform 0.1s, background-color 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            background-color: #7dd3fc;
        }

        .source-tag { 
            font-size: 12px; 
            color: var(--text-sub); 
            margin-top: 25px; 
            line-height: 1.6; 
            background: #111827;
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Trippel-Prognosen</h1>
        <p id="location">Hämtar din GPS-position...</p>
        <div class="temp" id="avg-temp">--°C</div>
        <p id="avg-condition">Väntar på uppdatering...</p>
        
        <div class="details">
            <div class="detail-item">
                <span>💨 Vind</span>
                <strong id="avg-wind">-- m/s</strong>
            </div>
            <div style="display: table-cell; width: 4%;"></div>
            <div class="detail-item">
                <span>🌧️ Regn</span>
                <strong id="avg-rain">-- mm</strong>
            </div>
        </div>

        <div class="source-tag" id="source-status">
            <strong>Normal bas-viktning:</strong><br>
            🇸🇪 SMHI (45%) | 🇳🇴 Yr (45%) | 🌍 Open-Meteo (10%)
        </div>
    </div>

    <button onclick="getWeather()">Uppdatera superprognos</button>
</div>

<script>
    async function getWeather() {
        if (!navigator.geolocation) {
            document.getElementById('location').innerText = "Geolokalisering stöds inte.";
            return;
        }

        document.getElementById('avg-condition').innerText = "Anropar servrar...";
        document.getElementById('avg-condition').style.color = "var(--primary)";

        navigator.geolocation.getCurrentPosition(async (position) => {
            const lat = position.coords.latitude.toFixed(4);
            const lon = position.coords.longitude.toFixed(4);
            document.getElementById('location').innerText = `Plats: ${parseFloat(lat).toFixed(2)}, ${parseFloat(lon).toFixed(2)}`;

            // Definiera tänkta grundvikter
            const basVikter = { smhi: 0.45, yr: 0.45, meteo: 0.10 };
            
            // Behållare för fungerande data
            let aktivaKällor = [];
            let totalViktFungerande = 0;

            let sumTemp = 0;
            let sumWind = 0;
            let sumRain = 0;

            // 1. HÄMTA SMHI DATA
            try {
                const res = await fetch(`https://opendata-download-metfcst.smhi.se/api/category/pmp3g/version/2/geotype/point/lon/${lon}/lat/${lat}/data.json`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                const current = data.timeSeries[0].parameters;
                
                sumTemp += current.find(p => p.name === "t").values[0] * basVikter.smhi;
                sumWind += current.find(p => p.name === "ws").values[0] * basVikter.smhi;
                sumRain += current.find(p => p.name === "pmean").values[0] * basVikter.smhi;
                
                aktivaKällor.push("SMHI");
                totalViktFungerande += basVikter.smhi;
            } catch(e) { console.warn("SMHI kunde inte hämtas."); }

            // 2. HÄMTA YR DATA
            try {
                const res = await fetch(`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${lat}&lon=${lon}`, {
                    headers: { 'User-Agent': 'SuperVaderPWA/2.0' }
                });
                if (!res.ok) throw new Error();
                const data = await res.json();
                const current = data.properties.timeseries[0].data;
                
                sumTemp += current.instant.details.air_temperature * basVikter.yr;
                sumWind += current.instant.details.wind_speed * basVikter.yr;
                sumRain += (current.next_1_hours ? current.next_1_hours.details.precipitation_amount : 0) * basVikter.yr;
                
                aktivaKällor.push("Yr");
                totalViktFungerande += basVikter.yr;
            } catch(e) { console.warn("Yr kunde inte hämtas."); }

            // 3. HÄMTA OPEN-METEO DATA
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,rain,wind_speed_10m`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                
                sumTemp += data.current.temperature_2m * basVikter.meteo;
                sumWind += (data.current.wind_speed_10m / 3.6) * basVikter.meteo; // km/h -> m/s
                sumRain += (data.current.rain || 0) * basVikter.meteo;
                
                aktivaKällor.push("Open-Meteo");
                totalViktFungerande += basVikter.meteo;
            } catch(e) { console.warn("Open-Meteo kunde inte hämtas."); }


            // 4. SAMMANSTÄLL OCH RÄKNA OM UTIFRÅN VILKA SOM SVARADE
            if (aktivaKällor.length === 0) {
                document.getElementById('avg-condition').innerText = "Hoppsan! Inget API svarade. Kontrollera nätverket.";
                document.getElementById('avg-condition').style.color = "var(--warning)";
                return;
            }

            // Normalisera vikterna (Gör så att de kvarvarande källorna tillsammans blir 100%)
            const slutligTemp = (sumTemp / totalViktFungerande).toFixed(1);
            const slutligWind = (sumWind / totalViktFungerande).toFixed(1);
            const slutligRain = (sumRain / totalViktFungerande).toFixed(1);

            // 5. UPPDATERA UI
            document.getElementById('avg-temp').innerText = `${slutligTemp}°C`;
            document.getElementById('avg-wind').innerText = `${slutligWind} m/s`;
            document.getElementById('avg-rain').innerText = `${slutligRain} mm`;

            // Statusmeddelande beroende på om alla eller bara några svarade
            if (aktivaKällor.length === 3) {
                document.getElementById('avg-condition').innerText = "Trippel-verifierad prognos klar!";
                document.getElementById('avg-condition').style.color = "var(--success)";
            } else {
                document.getElementById('avg-condition').innerText = "Prognos beräknad (vissa källor saknas)";
                document.getElementById('avg-condition').style.color = "var(--warning)";
            }

            // Visa exakt vilka servrar som bygger upp datan just nu
            document.getElementById('source-status').innerHTML = `
                <strong>Data beräknad live från:</strong><br>
                ${aktivaKällor.join(' + ')} (Vikter balanserade)
            `;
        });
    }

    // Kör automatiskt vid start
    window.onload = getWeather;

    // PWA Service Worker registrering
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(err => console.log(err));
        });
    }
</script>
</body>
</html>
