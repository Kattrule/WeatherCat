<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperVäder PWA - Wind & Color Edition</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1b4b">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-sub: #cbd5e1;
            --primary: #38bdf8;   
            --accent-temp: #f97316; 
            --accent-wind: #34d399; /* Mintgrön för vind */
            --accent-rain: #60a5fa; 
            --warning: #f43f5e;   
            --item-bg: rgba(15, 23, 42, 0.6);
        }
        
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container { max-width: 500px; width: 100%; margin: 0 auto; }

        /* SÖKRUTA */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-box input {
            flex: 1;
            padding: 15px;
            border-radius: 15px;
            border: 2px solid #475569;
            background: rgba(30, 41, 59, 0.9);
            color: var(--text-main);
            font-size: 16px;
            backdrop-filter: blur(10px);
        }
        .search-box input:focus {
            border-color: var(--primary);
            outline: none;
        }
        .search-box button {
            width: auto;
            padding: 0 25px;
            margin-bottom: 0;
            border-radius: 15px;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        /* VÄDERKORT */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 15px rgba(56, 189, 248, 0.1);
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        h1, h2 { margin-top: 0; }
        h1 { font-size: 26px; color: var(--text-main); text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        h2 { font-size: 18px; color: var(--primary); text-align: left; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
        
        .temp { font-size: 68px; font-weight: 800; color: var(--accent-temp); margin: 10px 0; text-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        #avg-condition { font-size: 14px; color: #a7f3d0; margin-bottom: 20px; font-weight: bold; }

        .details { display: flex; gap: 12px; margin-top: 20px; }
        .detail-item { 
            flex: 1; background: var(--item-bg); padding: 15px; 
            border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); 
        }
        .detail-item.wind-box span { color: var(--accent-wind); }
        .detail-item.rain-box span { color: var(--accent-rain); }
        .detail-item span { font-size: 13px; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
        .detail-item strong { display: block; font-size: 18px; margin-top: 5px; }
        .detail-item small { display: block; font-size: 12px; color: var(--text-sub); margin-top: 2px; }

        /* TIMPROGNOS (Horisontell scroll) */
        .hourly-scroll {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding-bottom: 12px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }
        .hourly-item {
            background: var(--item-bg);
            min-width: 105px;
            padding: 15px 10px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .hourly-time { font-size: 13px; color: var(--text-sub); margin-bottom: 5px; }
        .hourly-temp { font-size: 19px; font-weight: bold; color: var(--accent-temp); }
        .hourly-rain { font-size: 12px; color: var(--accent-rain); margin-top: 5px; font-weight: bold; }
        .hourly-wind { font-size: 12px; color: var(--accent-wind); margin-top: 3px; font-weight: 500; }

        /* DAGSPROGNOS (Lista) */
        .daily-list { display: flex; flex-direction: column; gap: 10px; }
        .daily-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--item-bg);
            padding: 15px 15px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .daily-day { font-weight: bold; width: 75px; }
        .daily-rain-info { text-align: center; width: 100px; }
        .daily-rain-chance { font-size: 12px; color: var(--accent-rain); font-weight: bold; }
        .daily-rain-amount { font-size: 11px; color: var(--text-sub); }
        
        .daily-wind-info { text-align: center; width: 110px; font-size: 12px; color: var(--accent-wind); }
        .daily-wind-speed { font-weight: bold; }
        .daily-wind-deg { font-size: 11px; color: var(--text-sub); }

        .daily-temps { color: var(--accent-temp); font-weight: bold; text-align: right; width: 75px; }
        .daily-temps span { color: #64748b; font-weight: normal; margin-left: 5px; }

    </style>
</head>
<body>

<div class="container">
    
    <div class="search-box">
        <input type="text" id="search-input" placeholder="Sök stad (t.ex. Göteborg)...">
        <button onclick="searchCity()">Sök</button>
    </div>

    <div class="card">
        <h1 id="location">Hämtar din position...</h1>
        <div class="temp" id="avg-temp">--°C</div>
        <p id="avg-condition">Väntar på data...</p>
        
        <div class="details">
            <div class="detail-item wind-box">
                <span>💨 Vind</span>
                <strong id="avg-wind">-- m/s</strong>
                <small id="avg-wind-deg">--° (--)</small>
            </div>
            <div class="detail-item rain-box">
                <span>🌧️ Regn</span>
                <strong id="avg-rain">-- mm</strong>
                <small id="avg-rain-sub">Realtid</small>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>Kommande 24 timmarna</h2>
        <div class="hourly-scroll" id="hourly-container">
            Laddar timmar...
        </div>
    </div>

    <div class="card">
        <h2>7-dygnsprognos</h2>
        <div class="daily-list" id="daily-container">
            Laddar dagar...
        </div>
    </div>

</div>

<script>
    // Hjälpfunktion för att göra om grader (vinkel) till väderstreck
    function getWindText(deg) {
        if (deg >= 337.5 || deg < 22.5) return 'Nord';
        if (deg >= 22.5 && deg < 67.5) return 'Nordost';
        if (deg >= 67.5 && deg < 112.5) return 'Öst';
        if (deg >= 112.5 && deg < 157.5) return 'Sydost';
        if (deg >= 157.5 && deg < 202.5) return 'Syd';
        if (deg >= 202.5 && deg < 247.5) return 'Sydväst';
        if (deg >= 247.5 && deg < 292.5) return 'Väst';
        if (deg >= 292.5 && deg < 337.5) return 'Nordväst';
        return '';
    }

    window.onload = () => {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => loadWeatherData(pos.coords.latitude, pos.coords.longitude, "Min position"),
                () => loadWeatherData(59.3293, 18.0686, "Stockholm (Standard)")
            );
        } else {
            loadWeatherData(59.3293, 18.0686, "Stockholm (Standard)");
        }
    };

    async function searchCity() {
        const query = document.getElementById('search-input').value;
        if (!query) return;

        document.getElementById('location').innerText = "Söker...";
        
        try {
            const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${query}&count=1&language=sv&format=json`);
            const data = await res.json();
            
            if (data.results && data.results.length > 0) {
                const city = data.results[0];
                loadWeatherData(city.latitude, city.longitude, city.name);
            } else {
                document.getElementById('location').innerText = "Staden hittades inte.";
            }
        } catch (e) {
            console.error(e);
        }
    }

    async function loadWeatherData(lat, lon, locationName) {
        document.getElementById('location').innerText = locationName;
        
        const queryLat = parseFloat(lat).toFixed(4);
        const queryLon = parseFloat(lon).toFixed(4);
        const smhiLat = parseFloat(lat).toFixed(6);
        const smhiLon = parseFloat(lon).toFixed(6);

        const basVikter = { smhi: 0.45, yr: 0.45, meteo: 0.10 };
        let totalVikt = 0, sumTemp = 0, sumWind = 0, sumWindDeg = 0, sumRain = 0;
        let källor = [];

        // SMHI
        try {
            const res = await fetch(`https://opendata-download-metfcst.smhi.se/api/category/pmp3g/version/2/geotype/point/lon/${smhiLon}/lat/${smhiLat}/data.json`);
            if (res.ok) {
                const data = await res.json();
                const current = data.timeSeries[0].parameters;
                sumTemp += current.find(p => p.name === "t").values[0] * basVikter.smhi;
                sumWind += current.find(p => p.name === "ws").values[0] * basVikter.smhi;
                sumWindDeg += current.find(p => p.name === "wd").values[0] * basVikter.smhi;
                sumRain += current.find(p => p.name === "pmean").values[0] * basVikter.smhi;
                totalVikt += basVikter.smhi; källor.push("SMHI");
            }
        } catch(e) {}

        // Yr
        try {
            const res = await fetch(`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${queryLat}&lon=${queryLon}`, { headers: { 'User-Agent': 'SuperVaderPWA/4.0' }});
            if (res.ok) {
                const data = await res.json();
                const current = data.properties.timeseries[0].data;
                sumTemp += current.instant.details.air_temperature * basVikter.yr;
                sumWind += current.instant.details.wind_speed * basVikter.yr;
                sumWindDeg += current.instant.details.wind_from_direction * basVikter.yr;
                sumRain += (current.next_1_hours ? current.next_1_hours.details.precipitation_amount : 0) * basVikter.yr;
                totalVikt += basVikter.yr; källor.push("Yr");
            }
        } catch(e) {}

        // Open-Meteo (Hämtar nu även vindhastighet och vindvinklar för timmar och dagar!)
        try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${queryLat}&longitude=${queryLon}&current=temperature_2m,rain,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,precipitation,precipitation_probability,wind_speed_10m,wind_direction_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_dominant_wind_direction&timezone=auto`);
            const data = await res.json();

            sumTemp += data.current.temperature_2m * basVikter.meteo;
            sumWind += (data.current.wind_speed_10m / 3.6) * basVikter.meteo; // km/h -> m/s
            sumWindDeg += data.current.wind_direction_10m * basVikter.meteo;
            sumRain += (data.current.rain || 0) * basVikter.meteo;
            totalVikt += basVikter.meteo; källor.push("Open-Meteo");

            // RÄKNA UT OCH VISA: JUST NU
            const finalWindSpeed = (sumWind / totalVikt).toFixed(1);
            const finalWindDeg = Math.round(sumWindDeg / totalVikt);

            document.getElementById('avg-temp').innerText = `${(sumTemp / totalVikt).toFixed(1)}°C`;
            document.getElementById('avg-wind').innerText = `${finalWindSpeed} m/s`;
            document.getElementById('avg-wind-deg').innerText = `${finalWindDeg}° (${getWindText(finalWindDeg)})`;
            document.getElementById('avg-rain').innerText = `${(sumRain / totalVikt).toFixed(1)} mm`;
            document.getElementById('avg-condition').innerText = `🧬 Precisionsberäknat via: ${källor.join(', ')}`;

            // RENDERA: TIMMAR (Kommande 24h med regn och vind adderat)
            const hourlyContainer = document.getElementById('hourly-container');
            hourlyContainer.innerHTML = '';
            for (let i = 0; i < 24; i++) {
                const timeString = new Date(data.hourly.time[i]).toLocaleTimeString('sv-SE', { hour: '2-digit', minute:'2-digit' });
                const temp = Math.round(data.hourly.temperature_2m[i]);
                const rainAmount = data.hourly.precipitation[i];
                const rainProb = data.hourly.precipitation_probability[i];
                const windSpeed = (data.hourly.wind_speed_10m[i] / 3.6).toFixed(1); // km/h -> m/s
                const windDeg = data.hourly.wind_direction_10m[i];
                
                hourlyContainer.innerHTML += `
                    <div class="hourly-item">
                        <div class="hourly-time">${i === 0 ? 'Nu' : timeString}</div>
                        <div class="hourly-temp">${temp}°</div>
                        <div class="hourly-rain">💧 ${rainProb}%<br><span style="font-size:10px; font-weight:normal; color:var(--text-sub);">${rainAmount > 0 ? `${rainAmount}mm` : '0mm'}</span></div>
                        <div class="hourly-wind">💨 ${windSpeed}<br><span style="font-size:10px; color:var(--text-sub);">${windDeg}°</span></div>
                    </div>
                `;
            }

            // RENDERA: DAGAR (7 dygn med maxvind och dominerande vinkel)
            const dailyContainer = document.getElementById('daily-container');
            dailyContainer.innerHTML = '';
            const veckodagar = ['Sön', 'Mån', 'Tis', 'Ons', 'Tor', 'Fre', 'Lör'];
            
            for (let i = 0; i < 7; i++) {
                const date = new Date(data.daily.time[i]);
                const dayName = i === 0 ? 'Idag' : veckodagar[date.getDay()];
                const maxTemp = Math.round(data.daily.temperature_2m_max[i]);
                const minTemp = Math.round(data.daily.temperature_2m_min[i]);
                const dailyRainSum = data.daily.precipitation_sum[i];
                const dailyRainProb = data.daily.precipitation_probability_max[i];
                const maxWind = (data.daily.wind_speed_10m_max[i] / 3.6).toFixed(1); // km/h -> m/s
                const domWindDeg = data.daily.wind_dominant_wind_direction[i];

                dailyContainer.innerHTML += `
                    <div class="daily-item">
                        <div class="daily-day">${dayName}</div>
                        
                        <div class="daily-rain-info">
                            <div class="daily-rain-chance">💧 ${dailyRainProb}%</div>
                            <div class="daily-rain-amount">${dailyRainSum > 0 ? `${dailyRainSum.toFixed(1)} mm` : '0 mm'}</div>
                        </div>

                        <div class="daily-wind-info">
                            <div class="daily-wind-speed">💨 ${maxWind} m/s</div>
                            <div class="daily-wind-deg">${domWindDeg}° (${getWindText(domWindDeg)})</div>
                        </div>

                        <div class="daily-temps">${maxTemp}° <span>${minTemp}°</span></div>
                    </div>
                `;
            }

        } catch (e) {
            console.error(e);
            document.getElementById('avg-condition').innerText = "Kunde inte synka alla källor.";
            document.getElementById('avg-condition').style.color = "var(--warning)";
        }
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(err => console.log(err)));
    }
</script>
</body>
</html>
