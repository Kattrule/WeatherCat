<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperVäder PWA - Pro Edition</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #38bdf8;
            --success: #34d399;
            --warning: #fbbf24;
            --item-bg: #111827;
        }
        
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { max-width: 500px; width: 100%; margin: 0 auto; }

        /* SÖKRUTA */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-box input {
            flex: 1;
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #334155;
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 16px;
        }
        .search-box button {
            width: auto;
            padding: 0 20px;
            margin-bottom: 0;
            border-radius: 15px;
        }

        /* HUVUDKORT */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            border: 1px solid #334155;
            text-align: center;
        }

        h1, h2 { margin-top: 0; }
        h1 { font-size: 24px; color: var(--text-main); }
        h2 { font-size: 18px; color: var(--text-sub); text-align: left; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 5px; }
        
        .temp { font-size: 64px; font-weight: 700; color: var(--primary); margin: 10px 0; }
        #avg-condition { font-size: 14px; color: var(--success); margin-bottom: 20px; }

        .details { display: flex; gap: 10px; margin-top: 20px; }
        .detail-item { 
            flex: 1; background: var(--item-bg); padding: 15px; 
            border-radius: 12px; border: 1px solid #1f2937; 
        }
        .detail-item span { color: var(--text-sub); font-size: 13px; text-transform: uppercase; }
        .detail-item strong { display: block; font-size: 18px; margin-top: 5px; }

        button {
            background: var(--primary); color: #0f172a; border: none;
            padding: 15px 20px; border-radius: 20px; font-size: 16px; font-weight: bold;
            cursor: pointer; width: 100%; transition: transform 0.1s, background-color 0.2s;
        }
        button:active { transform: scale(0.98); }

        /* TIMPROGNOS (Horisontell scroll) */
        .hourly-scroll {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding-bottom: 10px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--card-bg);
        }
        .hourly-item {
            background: var(--item-bg);
            min-width: 90px;
            padding: 15px 10px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #1f2937;
        }
        .hourly-time { font-size: 13px; color: var(--text-sub); margin-bottom: 5px; }
        .hourly-temp { font-size: 18px; font-weight: bold; color: var(--text-main); }
        .hourly-rain-chance { font-size: 12px; color: #60a5fa; margin-top: 5px; font-weight: 500; }
        .hourly-rain-amount { font-size: 11px; color: var(--text-sub); }

        /* DAGSPROGNOS (Lista) */
        .daily-list { display: flex; flex-direction: column; gap: 10px; }
        .daily-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--item-bg);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #1f2937;
        }
        .daily-day { font-weight: bold; width: 80px; }
        .daily-temps { color: var(--text-main); }
        .daily-temps span { color: var(--text-sub); margin-left: 10px; }

    </style>
</head>
<body>

<div class="container">
    
    <div class="search-box">
        <input type="text" id="search-input" placeholder="Sök stad (t.ex. Kristinehamn)...">
        <button onclick="searchCity()">Sök</button>
    </div>

    <div class="card">
        <h1 id="location">Hämtar din position...</h1>
        <div class="temp" id="avg-temp">--°C</div>
        <p id="avg-condition">Väntar på data...</p>
        
        <div class="details">
            <div class="detail-item">
                <span>💨 Vind</span>
                <strong id="avg-wind">-- m/s</strong>
            </div>
            <div class="detail-item">
                <span>🌧️ Regn</span>
                <strong id="avg-rain">-- mm</strong>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>Kommande 24 timmarna</h2>
        <div class="hourly-scroll" id="hourly-container">
            Laddar timmar...
        </div>
    </div>

    <div class="card">
        <h2>7-dygnsprognos</h2>
        <div class="daily-list" id="daily-container">
            Laddar dagar...
        </div>
    </div>

</div>

<script>
    // Startar när sidan laddas - kollar GPS
    window.onload = () => {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => loadWeatherData(pos.coords.latitude, pos.coords.longitude, "Min position"),
                () => loadWeatherData(59.3293, 18.0686, "Stockholm (Standard)") // Fallback om GPS nekas
            );
        } else {
            loadWeatherData(59.3293, 18.0686, "Stockholm (Standard)");
        }
    };

    // 1. SÖKFUNKTION (Hämtar Lat/Lon från namn)
    async function searchCity() {
        const query = document.getElementById('search-input').value;
        if (!query) return;

        document.getElementById('location').innerText = "Söker...";
        
        try {
            const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${query}&count=1&language=sv&format=json`);
            const data = await res.json();
            
            if (data.results && data.results.length > 0) {
                const city = data.results[0];
                loadWeatherData(city.latitude, city.longitude, city.name);
            } else {
                document.getElementById('location').innerText = "Staden hittades inte.";
            }
        } catch (e) {
            console.error("Geocoding-fel:", e);
        }
    }

    // 2. HÄMTA OCH BERÄKNA ALLT VÄDER
    async function loadWeatherData(lat, lon, locationName) {
        document.getElementById('location').innerText = locationName;
        document.getElementById('avg-condition').innerText = "Samlar in data...";
        
        // Formatera koordinaterna till strängar för API-anropen
        const queryLat = parseFloat(lat).toFixed(4);
        const queryLon = parseFloat(lon).toFixed(4);

        // SMHI kräver strikt 6 decimaler för att inte kasta 400 Bad Request
        const smhiLat = parseFloat(lat).toFixed(6);
        const smhiLon = parseFloat(lon).toFixed(6);

        // --- DEL A: JUST NU (Trippel-API med felhantering) ---
        const basVikter = { smhi: 0.45, yr: 0.45, meteo: 0.10 };
        let totalVikt = 0, sumTemp = 0, sumWind = 0, sumRain = 0;
        let källor = [];

        // SMHI anrop
        try {
            const res = await fetch(`https://opendata-download-metfcst.smhi.se/api/category/pmp3g/version/2/geotype/point/lon/${smhiLon}/lat/${smhiLat}/data.json`);
            if (res.ok) {
                const data = await res.json();
                const current = data.timeSeries[0].parameters;
                sumTemp += current.find(p => p.name === "t").values[0] * basVikter.smhi;
                sumWind += current.find(p => p.name === "ws").values[0] * basVikter.smhi;
                sumRain += current.find(p => p.name === "pmean").values[0] * basVikter.smhi;
                totalVikt += basVikter.smhi; 
                källor.push("SMHI");
            } else {
                console.warn(`SMHI svarade med status: ${res.status}. (Kan bero på att platsen är utanför SMHI:s täckningsområde).`);
            }
        } catch(e) {
            console.error("Kunde inte nå SMHI:", e);
        }

        // Yr (Met.no) anrop
        try {
            const res = await fetch(`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${queryLat}&lon=${queryLon}`, { headers: { 'User-Agent': 'SuperVaderPWA/4.0' }});
            if (res.ok) {
                const data = await res.json();
                const current = data.properties.timeseries[0].data;
                sumTemp += current.instant.details.air_temperature * basVikter.yr;
                sumWind += current.instant.details.wind_speed * basVikter.yr;
                sumRain += (current.next_1_hours ? current.next_1_hours.details.precipitation_amount : 0) * basVikter.yr;
                totalVikt += basVikter.yr; 
                källor.push("Yr");
            } else {
                console.warn(`Yr svarade med status: ${res.status}`);
            }
        } catch(e) {
            console.error("Kunde inte nå Yr:", e);
        }

        // --- DEL B: PROGNOSER (Open-Meteo) ---
        // Nu hämtar vi även "precipitation_probability" för timmarna!
        try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${queryLat}&longitude=${queryLon}&current=temperature_2m,rain,wind_speed_10m&hourly=temperature_2m,precipitation,precipitation_probability&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto`);
            const data = await res.json();

            // Lägg till Open-Meteo i "Just nu"-kalkylen
            sumTemp += data.current.temperature_2m * basVikter.meteo;
            sumWind += (data.current.wind_speed_10m / 3.6) * basVikter.meteo;
            sumRain += (data.current.rain || 0) * basVikter.meteo;
            totalVikt += basVikter.meteo; 
            källor.push("Open-Meteo");

            // RENDERA: JUST NU
            document.getElementById('avg-temp').innerText = `${(sumTemp / totalVikt).toFixed(1)}°C`;
            document.getElementById('avg-wind').innerText = `${(sumWind / totalVikt).toFixed(1)} m/s`;
            document.getElementById('avg-rain').innerText = `${(sumRain / totalVikt).toFixed(1)} mm`;
            
            if (källor.length > 0) {
                document.getElementById('avg-condition').innerText = `Data beräknad från: ${källor.join(', ')}`;
                document.getElementById('avg-condition').style.color = "var(--success)";
            } else {
                document.getElementById('avg-condition').innerText = "Kunde inte beräkna realtidsdata.";
                document.getElementById('avg-condition').style.color = "var(--warning)";
            }

            // RENDERA: TIMMAR (Kommande 24 timmarna med % risk och mm mängd)
            const hourlyContainer = document.getElementById('hourly-container');
            hourlyContainer.innerHTML = '';
            for (let i = 0; i < 24; i++) {
                const timeString = new Date(data.hourly.time[i]).toLocaleTimeString('sv-SE', { hour: '2-digit', minute:'2-digit' });
                const temp = Math.round(data.hourly.temperature_2m[i]);
                const rainAmount = data.hourly.precipitation[i];
                const rainProb = data.hourly.precipitation_probability[i]; // Hämtar %-risken
                
                hourlyContainer.innerHTML += `
                    <div class="hourly-item">
                        <div class="hourly-time">${i === 0 ? 'Nu' : timeString}</div>
                        <div class="hourly-temp">${temp}°</div>
                        <div class="hourly-rain-chance">💧 ${rainProb}%</div>
                        <div class="hourly-rain-amount">${rainAmount > 0 ? `${rainAmount} mm` : '0 mm'}</div>
                    </div>
                `;
            }

            // RENDERA: DAGAR (7 dagar)
            const dailyContainer = document.getElementById('daily-container');
            dailyContainer.innerHTML = '';
            const veckodagar = ['Sön', 'Mån', 'Tis', 'Ons', 'Tor', 'Fre', 'Lör'];
            
            for (let i = 0; i < 7; i++) {
                const date = new Date(data.daily.time[i]);
                const dayName = i === 0 ? 'Idag' : veckodagar[date.getDay()];
                const maxTemp = Math.round(data.daily.temperature_2m_max[i]);
                const minTemp = Math.round(data.daily.temperature_2m_min[i]);
                const rain = data.daily.precipitation_sum[i];

                dailyContainer.innerHTML += `
                    <div class="daily-item">
                        <div class="daily-day">${dayName}</div>
                        <div style="font-size: 13px; color: var(--primary);">${rain > 0 ? `🌧️ ${rain} mm` : ''}</div>
                        <div class="daily-temps">${maxTemp}° <span>${minTemp}°</span></div>
                    </div>
                `;
            }

        } catch (e) {
            console.error("Ett kritiskt fel uppstod vid hämtning av prognosdata:", e);
            document.getElementById('avg-condition').innerText = "Kunde inte ladda prognoserna.";
            document.getElementById('avg-condition').style.color = "var(--warning)";
        }
    }

    // PWA Service Worker registrering
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(err => console.log(err)));
    }
</script>
</body>
</html>
